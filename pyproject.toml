[project]
name = "codex-cache-monitor"
version = "0.1.0"
description = "Scan Codex rollout sessions and serve live token/cache/cost analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "orjson>=3.10",
    "watchdog>=6.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
ccm = "ccm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["corpus: requires the real ~/.codex-shared session corpus"]
