[project]
name = "codex-cache-monitor"
version = "0.1.0"
description = "Scan Codex rollout sessions and serve live token/cache/cost analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "orjson>=3.10",
    "watchdog>=6.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
ccm = "ccm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built dashboard is a build product, so it is gitignored, and hatchling
# skips gitignored files unless they are named here. `just build-web` stages it.
# It belongs in the sdist too: uv builds the wheel out of the sdist.
artifacts = ["ccm/_web/**"]

[tool.hatch.build.targets.wheel]
packages = ["ccm"]

[tool.hatch.build.targets.wheel.force-include]
# An installed copy has no checkout to read the rate table from, so it carries
# one and writes it out to the config directory on first run.
"pricing.toml" = "ccm/pricing.default.toml"

[tool.hatch.build.targets.sdist]
include = ["ccm", "web", "tests", "packaging", "pricing.toml", "justfile", "README.md", "RELEASE.md"]
exclude = ["web/dist", "web/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["corpus: requires the real ~/.codex-shared session corpus"]
