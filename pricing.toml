source = "https://developers.openai.com/api/docs/pricing"

# Research preview: OpenAI's Codex rate card says the credit rates for this model
# are not final, so there is deliberately no entry for it and its tokens stay in
# the Data Quality unpriced list. models.dev copies gpt-5.3-codex's rates, which
# is a guess wearing a number. This is the largest unpriced model in a typical
# Codex corpus, so the gap is deliberate and worth knowing about: to close it,
# uncomment and set whatever rate you are actually charged.
#   [models."gpt-5.3-codex-spark"]
#   inherit = "gpt-5.2"    # 1.75 / 0.175 / 14, what models.dev assumes
#
# Likewise codex-auto-review: not a public SKU at all, but an internal alias for
# Codex's reviewer (openai/codex#19420 says it "doesn't exist in the API"). The
# underlying model is understood to be gpt-5.4, but pricing an alias at a guessed
# model's rate would invent spend rather than report it.
#   [models."codex-auto-review"] -- intentionally absent

# xAI does publish the long tier after all -- the earlier entry here was taken
# from a blog post that omitted it and put cached reads at 0.50. The vendor table
# doubles every category at the threshold, and bills *all* tokens at the long
# rate once a prompt reaches it.
[models."grok-4.5"]
input = 2.00
cached_input = 0.30
output = 6.00
long_context_threshold = 200_000
source = "https://docs.x.ai/docs/models"
[models."grok-4.5".long]
input = 4.00
# 0.60 and not the 1.00 models.dev lists: xAI's own table says 0.60, and 0.60 is
# what the doubling pattern on every other model of theirs predicts.
cached_input = 0.60
output = 12.00

[models."grok-4.20-0309-non-reasoning"]
input = 1.25
cached_input = 0.20
output = 2.50
long_context_threshold = 200_000
source = "https://docs.x.ai/docs/models"
[models."grok-4.20-0309-non-reasoning".long]
input = 2.50
cached_input = 0.40
output = 5.00

# Not a published model id -- the name appears only in logs -- but it is Grok 4.5
# under xAI's Build product, so it bills as grok-4.5. Confirmed by the operator of
# the account these sessions come from, which is a better source than the three
# candidate rate cards a search turns up.
[models."grok-4.5-build"]
inherit = "grok-4.5"

# Logged bare; xAI's published id is grok-build-0.1.
[models."grok-build"]
input = 1.00
cached_input = 0.20
output = 2.00
long_context_threshold = 200_000
source = "https://docs.x.ai/docs/models"
[models."grok-build".long]
input = 2.00
cached_input = 0.40
output = 4.00

[models."grok-composer-2.5-fast"]
input = 3.00
# xAI's published cache discount is 25% of the input rate; the cached rate for
# this specific model is not documented, so this is inferred.
cached_input = 0.75
output = 15.00
estimated = true
long_tier_unknown = true
source = "https://mem0.ai/blog/xai-grok-api-pricing"

# Provider-prefixed variants resolve to their base model automatically. Add an
# explicit entry such as [models."pooler/gpt-5.6-sol"] to price a route
# differently.


# ---------------------------------------------------------------------------
# Anthropic -- used by the Claude Code client.
#
# Cache writes are billed: 1.25x base input for a 5-minute entry, 2x for a
# 1-hour one, against cache reads at 0.1x. Claude Code writes long-TTL entries
# by default, so the 2x column is the one that matters here.
#
# Claude 4.6 and later carry the full 1M context window at standard pricing, so
# there is deliberately no [long] table on these -- unlike the GPT-5.6 family,
# a 900k prompt bills at exactly the same per-token rate as a 9k one.

[models."claude-opus-5"]
input = 5.00
cached_input = 0.50
cache_write = 6.25
cache_write_1h = 10.00
output = 25.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[models."claude-opus-4-8"]
inherit = "claude-opus-5"

[models."claude-fable-5"]
input = 10.00
cached_input = 1.00
cache_write = 12.50
cache_write_1h = 20.00
output = 50.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[models."claude-sonnet-4-6"]
