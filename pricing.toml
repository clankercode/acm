long_context_threshold = 200_000
source = "https://developers.openai.com/api/docs/pricing"
[models."gpt-5.4".long]
input = 5.00
cached_input = 0.50
output = 22.50

# The OpenAI pricing page shows no long-context tier for gpt-5.4-mini, so the
# short rates apply at every context length.
[models."gpt-5.4-mini"]
input = 0.75
cached_input = 0.075
output = 4.50
source = "https://wavespeed.ai/blog/posts/gpt-5-4-mini-pricing/"

# The 5.1-5.3 generations, still present in older sessions. No [long] tables:
# unlike the 5.6 family, OpenAI lists one rate per model for these.
[models."gpt-5.2"]
input = 1.75
cached_input = 0.175
output = 14.00
source = "https://developers.openai.com/api/docs/pricing"

[models."gpt-5.2-codex"]
